# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
cv:
  name: Julian Camits
  headline: Senior Backend Engineer & Software Architect
  location: Buenos Aires, Argentina
  email: juliancamits@gmail.com
  social_networks:
    - network: LinkedIn
      username: JulianCamits
    - network: GitHub
      username: juliancamits-tech
  sections:
    summary:
      - >
        Senior Backend Engineer with over 8 years of experience designing and building scalable backends, primarily using .NET and Python technologies. 
        Specialist in financial systems, Azure-based cloud architectures, and modernizing legacy systems into optimized, high-availability microservices.
    experience:
      - company: Remitee
        position: Software Architect
        location: Buenos Aires, Argentina
        start_date: 2025-05
        end_date: 2026-04
        highlights:
          - Participated in hiring processes for architecture and technical leadership positions, assessing software architecture knowledge, design patterns, scalability, and technical decision-making skills.
          - Designed a shared infrastructure platform composed of more than 10 reusable NuGet packages.
          - Defined abstractions for cloud services (messaging, persistence, and cross-cutting concerns), reducing dependency on specific cloud providers.
          - Implemented an extensible architecture that enabled the adoption of technologies such as Azure Service Bus and Kafka with minimal impact on consuming applications.
          - Implemented a compatibility layer between IdentityServer and Keycloak, enabling automatic user migration during authentication while preserving credentials, claims, and permissions.
      - company: Remitee
        position: Backend Developer
        location: Buenos Aires, Argentina
        start_date: 2023-03
        end_date: 2025-05
        highlights:
        - Developed an internal framework distributed as NuGet packages to encapsulate shared infrastructure concerns and accelerate the development of new services.
        - Defined standards for integration service development, unifying messaging, persistence, and error-handling patterns across multiple applications.
        - Designed and implemented integration microservices for external providers, communicating through Service Bus with the central processing engine, enabling new partnerships and improving existing integrations.
        - Provided technical guidance to client engineering teams integrating REST APIs, including authentication, endpoint workflows, error handling, and performance optimization.
        - Participated in technical hiring processes for software engineering positions, including CV screening, technical interviews, and assessment of .NET, database, and software design competencies.
      - company: Mercado Abierto Electrónico
        position: Software Architect / Backend Developer
        location: Buenos Aires, Argentina
        start_date: 2022-02
        end_date: 2023-03
        highlights:
          - Designed and implemented the integration between Bloomberg systems and the Central Bank of Argentina (BCRA) using the FIX protocol.
          - Defined the system architecture, ensuring scalability and low-latency communication.
          - Developed and maintained APIs for financial data exchange and administrative operations.
      - company: Contabilium
        position: Backend Developer
        location: Buenos Aires, Argentina
        start_date: 2021-04
        end_date: 2022-02
        highlights:
          - Built the migration from a legacy MVC monolith to a modern API and microservices architecture.
          - Maintained and improved the legacy system by solving critical fixes and adding new features.
      - company: IT Desarrollo
        position: Backend Developer
        location: Buenos Aires, Argentina
        start_date: 2016-11
        end_date: 2021-04
        highlights:
          - Developed and maintained the module for financial data processing systems (Credit Bureau).
          - Built ETL processes to import financial data from banking clients.
          - Implemented MSMQ for asynchronous message-based processing.
    education:
      - institution: Universidad de Palermo
        area: Information Technology
        degree: Bachelor's Degree
        start_date: 2017
        end_date: 2019
      - institution: O.R.T. Instituto Superior
        area: Programming and Systems Analysis
        degree: Associate Degree in Systems Analysis
        start_date: 2012
        end_date: 2016
    skills:
      - label: Languages
        details: C#, JavaScript, Python, Java
      - label: Frameworks & Infrastructure
        details: .NET Framework, .NET Core, ASP.NET MVC, Entity Framework, Azure Service Bus, Kafka, Keycloak, KeyVault, Azure DevOps, Azure Functions, Azure App Services
      - label: Architecture & Patterns
        details: Microservices, REST APIs, ETL, CQRS, Mediator, SourceGenerators, Analyzers, Clean Architecture, Unite Test, DDD, Event Sourcing, Integrations
      - label: Databases
        details: Microsoft SQL Server (MSSQL), Postgres, MongoDB, Redis, MySQL, SQLite, ElasticSearch
      - label: Protocols & Tools
        details: FIX, gRPC, MSMQ, Git, Swagger (OpenAPI), NuGet, JSON Schema
    certifications:
      - bullet: IA for everyone (2026)
      - bullet: Google Workspace (2026)
      - bullet: Google Cloud Engineering (2025)
      - bullet: PMI Certificate & ERP Implementer Certification (2016)
      - bullet: Microsoft Visual Studio Certification (2015)
      - bullet: IBM DB2 Database Design & Android Developer (2015)
    languages:
      - label: Spanish
        details: Native
      - label: English
        details: Intermediate (B1-B2)
design:
  theme: classic
  page:
    size: us-letter
    top_margin: 0.7in
    bottom_margin: 0.7in
    left_margin: 0.7in
    right_margin: 0.7in
    show_footer: true
    show_top_note: true
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 79, 144)
    headline: rgb(0, 79, 144)
    connections: rgb(0, 79, 144)
    section_titles: rgb(0, 79, 144)
    links: rgb(0, 79, 144)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      body: 10pt
      name: 30pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.4em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: center
    photo_width: 3.5cm
    photo_position: left
    photo_space_left: 0.4cm
    photo_space_right: 0.4cm
    space_below_name: 0.7cm
    space_below_headline: 0.7cm
    space_below_connections: 0.7cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ''
      space_between_connections: 0.5cm
  section_titles:
    type: with_partial_line
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.3cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 1.2em
    space_between_text_based_entries: 0.3em
    show_time_spans_in:
      - experience
  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: true
    degree_width: 1cm
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: •
      space_left: 0.15cm
      space_above: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.5em
  templates:
    footer: '*NAME -- PAGE_NUMBER/TOTAL_PAGES*'
    top_note: '*LAST_UPDATED CURRENT_DATE*'
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION**, AREA
        SUMMARY
        HIGHLIGHTS
      degree_column: '**DEGREE**'
      date_and_location_column: |-
        LOCATION
        DATE
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        DATE
    experience_entry:
      main_column: |-
        **COMPANY**, POSITION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        DATE
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE

locale:
  language: english
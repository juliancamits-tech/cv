<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae - Julian Camits</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #2c3e50; margin-bottom: 0.5rem; }
        p { color: #7f8c8d; margin-bottom: 2rem; }
        .grid { display: grid; gap: 1rem; }
        .btn {
            text-decoration: none;
            background-color: #0078d4;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
        }
        .btn:hover {
            background-color: #005a9e;
            transform: translateY(-2px);
        }
        .btn:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Curriculum Vitae</h1>
        <p>Select the language of the CV you wish to view:<br>
		Selecciona el idioma del CV que deseas visualizar:</p>
        <div class="grid">
            <a href='./eng.html' class='btn'>English</a>
<a href='./spa.html' class='btn'>Español</a>

        </div>
    </div>
</body>
</html>
